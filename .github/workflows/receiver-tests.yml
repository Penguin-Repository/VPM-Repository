name: VPM receiver tests

on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/tests/**
      - .github/workflows/receiver-tests.yml
      - .github/workflows/update-vpm.yml
      - .github/workflows/sync-vpm-yanks.yml
  push:
    branches: [master]
    paths:
      - .github/scripts/**
      - .github/tests/**
      - .github/workflows/receiver-tests.yml
      - .github/workflows/update-vpm.yml
      - .github/workflows/sync-vpm-yanks.yml

permissions:
  contents: write

jobs:
  migrate:
    name: Apply organization migration
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace active repository references
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          old = "Penguin" + "DOOM"
          new = "Penguin-Repository"
          listing_path = Path("vpm.json")
          workflow_path = Path(".github/workflows/receiver-tests.yml")

          for value in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              if not value:
                  continue
              path = Path(value)
              if path in (listing_path, workflow_path):
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")

          listing = json.loads(listing_path.read_text(encoding="utf-8"))
          listing["url"] = "https://raw.githubusercontent.com/Penguin-Repository/VPM-Repository/refs/heads/master/vpm.json"
          listing_path.write_text(json.dumps(listing, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="")

      - name: Verify active references
        shell: bash
        run: |
          old="Penguin""DOOM"
          if git grep -n -F "$old" -- ':!vpm.json' ':!.github/workflows/receiver-tests.yml'; then
            exit 1
          fi

      - name: Compile and test receiver
        run: |
          python -m compileall -q .github/scripts .github/tests
          python -m unittest discover -s .github/tests -p "test_*.py" -v

      - name: Restore CI workflow and commit migration
        shell: bash
        run: |
          git show origin/master:.github/workflows/receiver-tests.yml > .github/workflows/receiver-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update organization references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    name: Python 3.12 unit tests
    if: github.actor == 'github-actions[bot]' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile receiver modules
        run: python -m compileall -q .github/scripts .github/tests

      - name: Run receiver unit tests
        run: python -m unittest discover -s .github/tests -p "test_*.py" -v
