name: Sync VPM yanks

on:
  repository_dispatch:
    types: [sync-vpm-yanks]
  workflow_dispatch:
    inputs:
      package_name:
        description: Fixed VPM package name
        required: true
        default: jp.penguin.purebase
        type: string
      source_repository:
        description: Fixed Pure Base source repository
        required: true
        default: Penguin-Repository/Pure-Base
        type: string
      policy_commit_sha:
        description: Pure Base vpm-yanks.json policy commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vpm-repository-update
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize VPM yank policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_NAME: ${{ github.event.client_payload.packageName || inputs.package_name }}
      SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository || inputs.source_repository }}
      POLICY_COMMIT_SHA: ${{ github.event.client_payload.policyCommitSha || inputs.policy_commit_sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Reject non-master default branch
        if: github.event.repository.default_branch != 'master'
        run: |
          echo "VPM repository default branch must be master."
          exit 1

      - name: Checkout VPM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Synchronize yank policy
        id: sync
        run: python .github/scripts/sync_vpm_yanks.py

      - name: Publish synchronization result
        env:
          POLICY_COMMIT_SHA: ${{ steps.sync.outputs.policy_commit_sha }}
          YANKED_VERSIONS: ${{ steps.sync.outputs.yanked_versions }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [[ "$CHANGED" == "true" ]]; then
            result="updated"
          else
            result="already current"
          fi
          {
            echo "## VPM yank synchronization result"
            echo "- Verified policy commit: \`$POLICY_COMMIT_SHA\`"
            echo "- Yanked versions: \`$YANKED_VERSIONS\`"
            echo "- Result: \`$result\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push yank projection
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vpm.json
          git commit -m "Sync ${PACKAGE_NAME} yank policy"
          git push origin "HEAD:master"
