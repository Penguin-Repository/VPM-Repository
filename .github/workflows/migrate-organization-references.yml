name: Migrate organization references

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Replace legacy organization references
        shell: python
        run: |
          from pathlib import Path
          import json
          import subprocess

          old = "Penguin" + "DOOM"
          new = "Penguin-Repository"
          workflow = Path(".github/workflows/migrate-organization-references.yml")
          listing_path = Path("vpm.json")
          changed = []

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for value in paths:
              if not value:
                  continue
              path = Path(value)
              if path in (workflow, listing_path):
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(value)

          listing = json.loads(listing_path.read_text(encoding="utf-8"))
          listing["url"] = "https://raw.githubusercontent.com/Penguin-Repository/VPM-Repository/refs/heads/master/vpm.json"
          listing_path.write_text(json.dumps(listing, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="")
          changed.append("vpm.json (top-level URL only)")

          print("Updated files:")
          print("\n".join(changed))

      - name: Verify active code uses the new organization
        shell: bash
        run: |
          old="Penguin""DOOM"
          if git grep -n -F "$old" -- ':!vpm.json' ':!.github/workflows/migrate-organization-references.yml'; then
            echo "Legacy references remain outside historical VPM metadata."
            exit 1
          fi

      - name: Run VPM receiver tests
        shell: bash
        run: |
          python -m compileall -q .github/scripts .github/tests
          python -m unittest discover -s .github/tests -p "test_*.py" -v

      - name: Remove migration workflow and commit
        shell: bash
        run: |
          git rm -- .github/workflows/migrate-organization-references.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update organization references"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
