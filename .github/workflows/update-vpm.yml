name: Update VPM repository

on:
  repository_dispatch:
    types: [update-vpm]
  workflow_dispatch:
    inputs:
      package_name:
        description: VPM package name
        required: true
        default: jp.penguin.purebase
        type: string
      version:
        description: Semantic version, including prereleases
        required: true
        type: string
      commit_sha:
        description: Source release commit SHA
        required: true
        type: string
      package_url:
        description: Immutable GitHub release asset URL
        required: true
        type: string
      sha256:
        description: Expected release ZIP SHA-256
        required: true
        type: string
      release_url:
        description: Published GitHub release URL
        required: true
        type: string
      policy_commit_sha:
        description: Pure Base vpm-yanks.json policy commit SHA
        required: true
        type: string
      source_repository:
        description: Source repository in owner/name form
        required: true
        default: PenguinDOOM/Pure-Base
        type: string

permissions:
  contents: write

concurrency:
  group: vpm-repository-update
  cancel-in-progress: false

jobs:
  update:
    name: Validate package and update vpm.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_NAME: ${{ github.event.client_payload.packageName || inputs.package_name }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      TAG: ${{ github.event.client_payload.tag || inputs.version }}
      COMMIT_SHA: ${{ github.event.client_payload.commitSha || inputs.commit_sha }}
      # packageUrl is canonical; packageurl remains as a legacy fallback.
      PACKAGE_URL: ${{ github.event.client_payload.packageUrl || github.event.client_payload.packageurl || inputs.package_url }}
      EXPECTED_SHA256: ${{ github.event.client_payload.sha256 || inputs.sha256 }}
      RELEASE_URL: ${{ github.event.client_payload.releaseUrl || inputs.release_url }}
      SOURCE_REPOSITORY: ${{ github.event.client_payload.sourceRepository || inputs.source_repository }}
      POLICY_COMMIT_SHA: ${{ github.event.client_payload.policyCommitSha || inputs.policy_commit_sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Reject non-master default branch
        if: github.event.repository.default_branch != 'master'
        run: |
          echo "VPM repository default branch must be master."
          exit 1

      - name: Checkout VPM repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify receiver and unit tests
        run: |
          python -m compileall -q .github/scripts .github/tests
          python -m unittest discover -s .github/tests -p "test_*.py" -v

      - name: Validate dispatch and update listing
        id: update
        run: python .github/scripts/update_vpm.py

      - name: Commit and push listing
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vpm.json
          git commit -m "Add ${PACKAGE_NAME} ${VERSION}"
          git push origin "HEAD:master"
